<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>🌱 Retos por Mes | Planeta Consciente</title>
    
    <th:block layout:fragment="css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        
        <style>
            :root {
                --primary-green: #15631b;
                --primary-light: #07661c;
                --secondary-green: #e8f5e9;
                --accent-green: #4caf7d;
                --accent-dark: #3a8d66;
                --earth-brown: #8B4513;
                --warm-yellow: #FFD700;
                --text-dark: #1A3C34;
                --text-light: #F8FDFA;
                --easy-color: #66bb6a;
                --medium-color: #ffb74d;
                --hard-color: #ef5350;
                --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
                --shadow-md: 0 10px 20px rgba(0, 0, 0, 0.1);
                --shadow-lg: 0 15px 30px rgba(0, 0, 0, 0.15);
                --transition: all 0.4s cubic-bezier(0.645, 0.045, 0.355, 1);
            }
            
            .retos-content {
                background: linear-gradient(135deg, #f8f9fa 0%, var(--secondary-green) 100%);
                min-height: calc(100vh - 80px - 250px);
                padding: 3rem 0;
                animation: fadeIn 0.8s ease-out;
            }
            
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 30px;
            }
            
            /* Header Section */
            .page-header {
                text-align: center;
                margin-bottom: 4rem;
                position: relative;
            }
            
            .page-header::after {
                content: '';
                position: absolute;
                bottom: -20px;
                left: 50%;
                transform: translateX(-50%);
                width: 200px;
                height: 3px;
                background: linear-gradient(90deg, var(--accent-green), var(--warm-yellow), var(--accent-green));
                border-radius: 3px;
            }
            
            .page-title {
                font-family: 'Playfair Display', serif;
                font-size: 3.5rem;
                font-weight: 800;
                color: var(--primary-green);
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 15px;
            }
            
            .page-title i {
                color: var(--accent-green);
                font-size: 2.5rem;
                animation: pulse 2s infinite;
            }
            
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.1); }
                100% { transform: scale(1); }
            }
            
            .page-subtitle {
                font-size: 1.2rem;
                color: var(--text-dark);
                opacity: 0.8;
                max-width: 600px;
                margin: 0 auto;
                line-height: 1.6;
            }
            
            /* Admin Panel */
            .admin-panel {
                background: linear-gradient(135deg, #ffffff, #f8fdfa);
                border-radius: 16px;
                padding: 2rem;
                margin-bottom: 3rem;
                box-shadow: var(--shadow-md);
                border: 2px solid var(--accent-green);
                position: relative;
                overflow: hidden;
            }
            
            .admin-panel::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 4px;
                background: linear-gradient(90deg, var(--warm-yellow), var(--accent-green), var(--warm-yellow));
            }
            
            .admin-title {
                font-family: 'Playfair Display', serif;
                font-size: 1.8rem;
                color: var(--primary-green);
                margin-bottom: 1.5rem;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            
            .admin-buttons {
                display: flex;
                gap: 1rem;
                flex-wrap: wrap;
            }
            
            /* Modal Styles */
            .modal-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.7);
                z-index: 9999;
                backdrop-filter: blur(5px);
                animation: fadeInOverlay 0.3s ease;
            }
            
            @keyframes fadeInOverlay {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            
            .modal-content {
                background: white;
                border-radius: 20px;
                padding: 2.5rem;
                max-width: 600px;
                width: 90%;
                max-height: 90vh;
                overflow-y: auto;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                box-shadow: var(--shadow-lg);
                animation: slideInModal 0.4s ease;
                border-top: 5px solid var(--accent-green);
            }
            
            @keyframes slideInModal {
                from { 
                    opacity: 0; 
                    transform: translate(-50%, -60%);
                }
                to { 
                    opacity: 1; 
                    transform: translate(-50%, -50%);
                }
            }
            
            .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 2rem;
                padding-bottom: 1rem;
                border-bottom: 2px solid var(--secondary-green);
            }
            
            .modal-title {
                font-family: 'Playfair Display', serif;
                font-size: 2rem;
                color: var(--primary-green);
                margin: 0;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            
            .close-modal {
                background: none;
                border: none;
                font-size: 2rem;
                color: var(--text-dark);
                cursor: pointer;
                transition: var(--transition);
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .close-modal:hover {
                background: var(--secondary-green);
                color: var(--primary-green);
            }
            
            /* Form Styles */
            .form-group {
                margin-bottom: 1.5rem;
            }
            
            .form-label {
                display: block;
                margin-bottom: 0.5rem;
                color: var(--text-dark);
                font-weight: 600;
                font-size: 0.95rem;
            }
            
            .form-control {
                width: 100%;
                padding: 0.8rem 1rem;
                border: 2px solid #e2e8f0;
                border-radius: 8px;
                font-size: 1rem;
                font-family: 'Poppins', sans-serif;
                transition: var(--transition);
            }
            
            .form-control:focus {
                outline: none;
                border-color: var(--accent-green);
                box-shadow: 0 0 0 3px rgba(76, 175, 125, 0.2);
            }
            
            textarea.form-control {
                min-height: 120px;
                resize: vertical;
            }
            
            .select-group {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 1rem;
            }
            
            select.form-control {
                cursor: pointer;
                background: white;
            }
            
            .form-actions {
                display: flex;
                justify-content: flex-end;
                gap: 1rem;
                margin-top: 2rem;
                padding-top: 1.5rem;
                border-top: 2px solid var(--secondary-green);
            }
            
            /* Cards Grid */
            .months-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
                gap: 2rem;
                margin-bottom: 4rem;
            }
            
            .month-card {
                background: white;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: var(--shadow-md);
                transition: var(--transition);
                position: relative;
                border: 1px solid rgba(76, 175, 125, 0.1);
            }
            
            .month-card:hover {
                transform: translateY(-10px);
                box-shadow: var(--shadow-lg);
            }
            
            .month-header {
                background: linear-gradient(135deg, var(--primary-green), var(--primary-light));
                color: white;
                padding: 1.5rem;
                position: relative;
                overflow: hidden;
            }
            
            .month-header::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 4px;
                background: linear-gradient(90deg, var(--accent-green), var(--warm-yellow), var(--accent-green));
            }
            
            .month-title {
                font-family: 'Playfair Display', serif;
                font-size: 2rem;
                font-weight: 700;
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            
            .month-actions {
                display: flex;
                gap: 0.5rem;
            }
            
            .action-btn {
                background: rgba(255, 255, 255, 0.2);
                border: none;
                color: white;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: var(--transition);
                font-size: 0.9rem;
            }
            
            .action-btn:hover {
                background: white;
                color: var(--primary-green);
                transform: scale(1.1);
            }
            
            .month-content {
                padding: 2rem;
            }
            
            .challenge-item {
                background: linear-gradient(135deg, var(--secondary-green), #f8fdfa);
                padding: 1.5rem;
                border-radius: 12px;
                margin-bottom: 1.5rem;
                border-left: 4px solid var(--accent-green);
                transition: var(--transition);
            }
            
            .challenge-item:hover {
                transform: translateX(5px);
                background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            }
            
            .challenge-description {
                color: var(--text-dark);
                line-height: 1.6;
                margin-bottom: 1.2rem;
                font-size: 1.05rem;
            }
            
            .challenge-meta {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 1rem;
            }
            
            /* Badges */
            .badge-difficulty {
                padding: 0.5rem 1.2rem;
                border-radius: 25px;
                font-weight: 700;
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
            }
            
            .badge-easy {
                background: linear-gradient(135deg, var(--easy-color), #4caf50);
                color: white;
                box-shadow: 0 4px 12px rgba(102, 187, 106, 0.3);
            }
            
            .badge-medium {
                background: linear-gradient(135deg, var(--medium-color), #ff9800);
                color: #3e2723;
                box-shadow: 0 4px 12px rgba(255, 183, 77, 0.3);
            }
            
            .badge-hard {
                background: linear-gradient(135deg, var(--hard-color), #d32f2f);
                color: white;
                box-shadow: 0 4px 12px rgba(239, 83, 80, 0.3);
            }
            
            /* Buttons */
            .btn {
                padding: 0.8rem 2rem;
                border-radius: 8px;
                font-weight: 600;
                text-decoration: none;
                transition: var(--transition);
                display: inline-flex;
                align-items: center;
                gap: 0.8rem;
                border: none;
                cursor: pointer;
                font-size: 1rem;
                font-family: 'Poppins', sans-serif;
            }
            
            .btn-primary {
                background: linear-gradient(135deg, var(--primary-green), var(--primary-light));
                color: white;
                box-shadow: 0 4px 15px rgba(21, 99, 27, 0.3);
            }
            
            .btn-primary:hover {
                background: linear-gradient(135deg, var(--primary-light), var(--primary-green));
                transform: translateY(-3px);
                box-shadow: 0 8px 25px rgba(21, 99, 27, 0.4);
            }
            
            .btn-success {
                background: linear-gradient(135deg, var(--accent-green), var(--accent-dark));
                color: white;
                box-shadow: 0 4px 15px rgba(76, 175, 125, 0.3);
            }
            
            .btn-success:hover {
                background: linear-gradient(135deg, var(--accent-dark), var(--accent-green));
                transform: translateY(-3px);
                box-shadow: 0 8px 25px rgba(76, 175, 125, 0.4);
            }
            
            .btn-outline {
                background: transparent;
                border: 2px solid var(--accent-green);
                color: var(--accent-green);
            }
            
            .btn-outline:hover {
                background: var(--accent-green);
                color: white;
                transform: translateY(-3px);
            }
            
            .btn-danger {
                background: linear-gradient(135deg, #ef5350, #d32f2f);
                color: white;
                border: none;
            }
            
            .btn-danger:hover {
                background: linear-gradient(135deg, #d32f2f, #ef5350);
                transform: translateY(-3px);
            }
            
            /* Floating Add Button */
            .floating-add-btn {
                position: fixed;
                bottom: 30px;
                right: 30px;
                width: 70px;
                height: 70px;
                background: linear-gradient(135deg, var(--accent-green), var(--primary-green));
                color: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.8rem;
                box-shadow: 0 6px 20px rgba(76, 175, 125, 0.4);
                z-index: 100;
                transition: var(--transition);
                border: none;
                cursor: pointer;
                animation: float 3s ease-in-out infinite;
            }
            
            @keyframes float {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-10px); }
                100% { transform: translateY(0px); }
            }
            
            .floating-add-btn:hover {
                transform: scale(1.1) rotate(90deg);
                box-shadow: 0 10px 30px rgba(76, 175, 125, 0.6);
            }
            
            /* Toast Notification */
            .toast {
                position: fixed;
                bottom: 120px;
                right: 30px;
                background: white;
                padding: 1rem 1.5rem;
                border-radius: 8px;
                box-shadow: var(--shadow-lg);
                border-left: 4px solid var(--accent-green);
                z-index: 1000;
                display: flex;
                align-items: center;
                gap: 1rem;
                transform: translateX(150%);
                transition: transform 0.4s ease;
                max-width: 350px;
            }
            
            .toast.show {
                transform: translateX(0);
            }
            
            .toast-icon {
                font-size: 1.5rem;
                color: var(--accent-green);
            }
            
            .toast-message {
                color: var(--text-dark);
                font-weight: 500;
            }
            
            .close-toast {
                background: none;
                border: none;
                color: var(--text-dark);
                cursor: pointer;
                font-size: 1.2rem;
                padding: 0;
            }
            
            /* Responsive */
            @media (max-width: 768px) {
                .container {
                    padding: 0 20px;
                }
                
                .page-title {
                    font-size: 2.5rem;
                    flex-direction: column;
                    gap: 10px;
                }
                
                .months-grid {
                    grid-template-columns: 1fr;
                }
                
                .modal-content {
                    width: 95%;
                    padding: 1.5rem;
                }
                
                .admin-buttons {
                    flex-direction: column;
                }
                
                .floating-add-btn {
                    width: 60px;
                    height: 60px;
                    font-size: 1.5rem;
                    bottom: 20px;
                    right: 20px;
                }
            }
        </style>
    </th:block>
</head>
<body>
    <div layout:fragment="content" class="retos-content">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header">
                <h1 class="page-title">
                    <i class="fas fa-seedling"></i>
                    Retos Ambientales Mensuales
                    <i class="fas fa-leaf"></i>
                </h1>
                <p class="page-subtitle">
                    Desafíos ecológicos organizados por mes. ¡Agrega nuevos retos y contribuye al cuidado del planeta!
                </p>
            </div>

            <!-- Admin Panel -->
            <div class="admin-panel">
                <h3 class="admin-title">
                    <i class="fas fa-tools"></i> Panel de Administración
                </h3>
                <div class="admin-buttons">
                    <button class="btn btn-success" onclick="openModal('add')">
                        <i class="fas fa-plus"></i> Agregar Nuevo Reto
                    </button>
                    <button class="btn btn-primary" onclick="openModal('manage')">
                        <i class="fas fa-edit"></i> Gestionar Retos Existentes
                    </button>
                    
                    <button class="btn btn-danger" onclick="clearAllRetos()">
                        <i class="fas fa-trash"></i> Eliminar Todos los Retos
                    </button>
                </div>
            </div>

            <!-- Months Grid -->
            <div id="monthsGrid" class="months-grid">
                <!-- Los retos se agregarán dinámicamente aquí -->
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons" style="display: flex; justify-content: center; gap: 1.5rem; margin-top: 3rem; flex-wrap: wrap;">
                <a th:href="@{/eventos}" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> Volver a Eventos
                </a>
                <button class="btn btn-primary" onclick="openModal('add')">
                    <i class="fas fa-plus"></i> Agregar Más Retos
                </button>
            </div>
        </div>

        <!-- Floating Add Button -->
        <button class="floating-add-btn" onclick="openModal('add')">
            <i class="fas fa-plus"></i>
        </button>

        <!-- Toast Notification -->
        <div id="toast" class="toast">
            <i class="fas fa-check-circle toast-icon"></i>
            <span class="toast-message">Reto agregado exitosamente!</span>
            <button class="close-toast" onclick="hideToast()">&times;</button>
        </div>

        <!-- Modal for Adding/Editing Retos -->
        <div id="modalOverlay" class="modal-overlay" onclick="closeModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <h3 class="modal-title" id="modalTitle">
                        <i class="fas fa-plus-circle"></i> Agregar Nuevo Reto
                    </h3>
                    <button class="close-modal" onclick="closeModal()">&times;</button>
                </div>
                
                <form id="retoForm" onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label class="form-label">Mes del Reto:</label>
                        <select id="mesSelect" class="form-control" required>
                            <option value="">Seleccionar mes...</option>
                            <option value="Enero">Enero</option>
                            <option value="Febrero">Febrero</option>
                            <option value="Marzo">Marzo</option>
                            <option value="Abril">Abril</option>
                            <option value="Mayo">Mayo</option>
                            <option value="Junio">Junio</option>
                            <option value="Julio">Julio</option>
                            <option value="Agosto">Agosto</option>
                            <option value="Septiembre">Septiembre</option>
                            <option value="Octubre">Octubre</option>
                            <option value="Noviembre">Noviembre</option>
                            <option value="Diciembre">Diciembre</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Descripción del Reto:</label>
                        <textarea id="descripcionInput" class="form-control" 
                                  placeholder="Ej: Evitar el uso de plásticos de un solo uso durante todo el mes..." 
                                  required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Nivel de Dificultad:</label>
                        <div class="select-group">
                            <div>
                                <input type="radio" id="facil" name="dificultad" value="facil" checked>
                                <label for="facil" class="badge-difficulty badge-easy" style="cursor: pointer;">
                                    <i class="fas fa-smile"></i> Fácil
                                </label>
                            </div>
                            <div>
                                <input type="radio" id="media" name="dificultad" value="media">
                                <label for="media" class="badge-difficulty badge-medium" style="cursor: pointer;">
                                    <i class="fas fa-balance-scale"></i> Media
                                </label>
                            </div>
                            <div>
                                <input type="radio" id="alta" name="dificultad" value="alta">
                                <label for="alta" class="badge-difficulty badge-hard" style="cursor: pointer;">
                                    <i class="fas fa-fire"></i> Alta
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Puntos por Completar:</label>
                        <input type="number" id="puntosInput" class="form-control" 
                               min="50" max="500" value="100" required>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" onclick="closeModal()">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Guardar Reto
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- WhatsApp Float -->
        <a href="https://wa.me/573144358851" class="whatsapp-float" target="_blank">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>
    
    <th:block layout:fragment="scripts">
        <script>
            // Retos almacenados en localStorage
            let retos = JSON.parse(localStorage.getItem('retos')) || [
                {
                    mes: 'Enero',
                    descripcion: 'Evitar el uso de plásticos de un solo uso durante todo el mes. Incluye llevar bolsas reutilizables, usar botellas de agua recargables y evitar productos empaquetados en plástico.',
                    dificultad: 'media',
                    puntos: 150
                },
                {
                    mes: 'Febrero',
                    descripcion: 'Utilizar transporte público, bicicleta o caminar en lugar del coche privado al menos 3 días a la semana.',
                    dificultad: 'facil',
                    puntos: 100
                },
                {
                    mes: 'Abril',
                    descripcion: 'Consumir solo productos locales y de temporada durante el mes, evitando alimentos importados o procesados.',
                    dificultad: 'alta',
                    puntos: 250
                },
                {
                    mes: 'Junio',
                    descripcion: 'Generar menos de 1 kg de basura no reciclable durante todo el mes, aplicando técnicas de compostaje y reutilización.',
                    dificultad: 'alta',
                    puntos: 300
                }
            ];

            // Inicializar la página
            document.addEventListener('DOMContentLoaded', function() {
                renderRetos();
                updateStats();
            });

            // Renderizar todos los retos
            function renderRetos() {
                const monthsGrid = document.getElementById('monthsGrid');
                const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 
                              'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                
                monthsGrid.innerHTML = '';
                
                meses.forEach(mes => {
                    const retosDelMes = retos.filter(r => r.mes === mes);
                    
                    const monthCard = document.createElement('div');
                    monthCard.className = 'month-card';
                    monthCard.innerHTML = `
                        <div class="month-header" style="background: ${getMonthColor(mes)}">
                            <h3 class="month-title">
                                ${mes}
                                <i class="fas ${getMonthIcon(mes)} month-icon"></i>
                                <div class="month-actions">
                                    <button class="action-btn" onclick="editReto('${mes}')" title="Editar retos">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="action-btn" onclick="addRetoToMonth('${mes}')" title="Agregar reto">
                                        <i class="fas fa-plus"></i>
                                    </button>
                                </div>
                            </h3>
                        </div>
                        <div class="month-content">
                            ${retosDelMes.length > 0 ? 
                                retosDelMes.map((reto, index) => `
                                    <div class="challenge-item">
                                        <p class="challenge-description">
                                            <i class="fas ${getChallengeIcon(reto.dificultad)}" 
                                               style="color: ${getDifficultyColor(reto.dificultad)}; margin-right: 8px;"></i>
                                            ${reto.descripcion}
                                        </p>
                                        <div class="challenge-meta">
                                            <span class="badge-difficulty ${getBadgeClass(reto.dificultad)}">
                                                <i class="${getDifficultyIcon(reto.dificultad)}"></i>
                                                ${getDifficultyText(reto.dificultad)}
                                            </span>
                                            <span class="challenge-points">
                                                <i class="fas fa-star" style="color: #FFD700;"></i>
                                                ${reto.puntos} Puntos
                                            </span>
                                            <button class="action-btn" onclick="deleteReto('${mes}', ${index})" 
                                                    style="background: #ef5350; color: white; margin-left: auto;" 
                                                    title="Eliminar reto">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                `).join('') :
                                `<div class="challenge-item" style="background: #f5f5f5; border-left-color: #9E9E9E;">
                                    <p class="challenge-description" style="color: #666;">
                                        <i class="fas fa-plus-circle" style="color: #9E9E9E; margin-right: 8px;"></i>
                                        No hay retos para este mes. ¡Agrega uno nuevo!
                                    </p>
                                    <button class="btn btn-outline" onclick="addRetoToMonth('${mes}')" 
                                            style="margin-top: 10px; padding: 0.5rem 1rem;">
                                        <i class="fas fa-plus"></i> Agregar Reto
                                    </button>
                                </div>`
                            }
                        </div>
                    `;
                    
                    monthsGrid.appendChild(monthCard);
                });
                
                // Guardar en localStorage
                localStorage.setItem('retos', JSON.stringify(retos));
            }

            // Abrir modal
            function openModal(type, mes = '') {
                const modal = document.getElementById('modalOverlay');
                const title = document.getElementById('modalTitle');
                
                if (type === 'add') {
                    title.innerHTML = '<i class="fas fa-plus-circle"></i> Agregar Nuevo Reto';
                    resetForm();
                    if (mes) {
                        document.getElementById('mesSelect').value = mes;
                    }
                } else if (type === 'edit') {
                    title.innerHTML = '<i class="fas fa-edit"></i> Editar Reto';
                    // Para edición, cargaríamos los datos del reto
                }
                
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
            }

            // Cerrar modal
            function closeModal() {
                const modal = document.getElementById('modalOverlay');
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }

            // Manejar envío del formulario
            function handleSubmit(event) {
                event.preventDefault();
                
                const mes = document.getElementById('mesSelect').value;
                const descripcion = document.getElementById('descripcionInput').value;
                const dificultad = document.querySelector('input[name="dificultad"]:checked').value;
                const puntos = parseInt(document.getElementById('puntosInput').value);
                
                // Agregar nuevo reto
                retos.push({
                    mes: mes,
                    descripcion: descripcion,
                    dificultad: dificultad,
                    puntos: puntos
                });
                
                // Renderizar y mostrar notificación
                renderRetos();
                updateStats();
                showToast('Reto agregado exitosamente!');
                closeModal();
                resetForm();
            }

            // Agregar reto a un mes específico
            function addRetoToMonth(mes) {
                document.getElementById('mesSelect').value = mes;
                openModal('add');
            }

            // Editar retos de un mes
            function editReto(mes) {
                const retosDelMes = retos.filter(r => r.mes === mes);
                if (retosDelMes.length > 0) {
                    alert(`Editando ${retosDelMes.length} reto(s) de ${mes}`);
                    // Aquí se implementaría la edición de retos específicos
                }
            }

            // Eliminar un reto
            function deleteReto(mes, index) {
                if (confirm('¿Estás seguro de eliminar este reto?')) {
                    // Encontrar el índice global del reto
                    let globalIndex = -1;
                    for (let i = 0; i < retos.length; i++) {
                        if (retos[i].mes === mes) {
                            if (index === 0) {
                                globalIndex = i;
                                break;
                            }
                            index--;
                        }
                    }
                    
                    if (globalIndex !== -1) {
                        retos.splice(globalIndex, 1);
                        renderRetos();
                        showToast('Reto eliminado exitosamente!');
                    }
                }
            }

            // Eliminar todos los retos
            function clearAllRetos() {
                if (confirm('¿Estás seguro de eliminar TODOS los retos? Esta acción no se puede deshacer.')) {
                    retos = [];
                    renderRetos();
                    showToast('Todos los retos han sido eliminados!');
                }
            }

            // Exportar retos
            function exportRetos() {
                const dataStr = JSON.stringify(retos, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                
                const exportFileDefaultName = 'retos_ambientales.json';
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                
                showToast('Retos exportados exitosamente!');
            }

            // Resetear formulario
            function resetForm() {
                document.getElementById('retoForm').reset();
                document.getElementById('puntosInput').value = 100;
            }

            // Mostrar notificación
            function showToast(message) {
                const toast = document.getElementById('toast');
                toast.querySelector('.toast-message').textContent = message;
                toast.classList.add('show');
                
                setTimeout(() => {
                    hideToast();
                }, 5000);
            }

            // Ocultar notificación
            function hideToast() {
                const toast = document.getElementById('toast');
                toast.classList.remove('show');
            }

            // Actualizar estadísticas
            function updateStats() {
                // Puedes agregar lógica para actualizar estadísticas aquí
            }

            // Funciones auxiliares
            function getMonthColor(mes) {
                const colors = {
                    'Enero': 'linear-gradient(135deg, #15631b, #1b5e20)',
                    'Febrero': 'linear-gradient(135deg, #2196F3, #1976D2)',
                    'Marzo': 'linear-gradient(135deg, #4CAF50, #388E3C)',
                    'Abril': 'linear-gradient(135deg, #9C27B0, #7B1FA2)',
                    'Mayo': 'linear-gradient(135deg, #FF9800, #F57C00)',
                    'Junio': 'linear-gradient(135deg, #00BCD4, #0097A7)',
                    'Julio': 'linear-gradient(135deg, #F44336, #D32F2F)',
                    'Agosto': 'linear-gradient(135deg, #795548, #5D4037)',
                    'Septiembre': 'linear-gradient(135deg, #607D8B, #455A64)',
                    'Octubre': 'linear-gradient(135deg, #3F51B5, #303F9F)',
                    'Noviembre': 'linear-gradient(135deg, #FF5722, #E64A19)',
                    'Diciembre': 'linear-gradient(135deg, #009688, #00796B)'
                };
                return colors[mes] || 'linear-gradient(135deg, #15631b, #07661c)';
            }

            function getMonthIcon(mes) {
                const icons = {
                    'Enero': 'fa-snowflake',
                    'Febrero': 'fa-heart',
                    'Marzo': 'fa-leaf',
                    'Abril': 'fa-umbrella',
                    'Mayo': 'fa-sun',
                    'Junio': 'fa-water',
                    'Julio': 'fa-fire',
                    'Agosto': 'fa-mountain',
                    'Septiembre': 'fa-wind',
                    'Octubre': 'fa-cloud',
                    'Noviembre': 'fa-cloud-rain',
                    'Diciembre': 'fa-star'
                };
                return icons[mes] || 'fa-calendar';
            }

            function getChallengeIcon(dificultad) {
                return dificultad === 'facil' ? 'fa-seedling' : 
                       dificultad === 'media' ? 'fa-tree' : 'fa-mountain';
            }

            function getDifficultyColor(dificultad) {
                return dificultad === 'facil' ? '#66bb6a' : 
                       dificultad === 'media' ? '#ffb74d' : '#ef5350';
            }

            function getBadgeClass(dificultad) {
                return dificultad === 'facil' ? 'badge-easy' : 
                       dificultad === 'media' ? 'badge-medium' : 'badge-hard';
            }

            function getDifficultyIcon(dificultad) {
                return dificultad === 'facil' ? 'fas fa-smile' : 
                       dificultad === 'media' ? 'fas fa-balance-scale' : 'fas fa-fire';
            }

            function getDifficultyText(dificultad) {
                return dificultad === 'facil' ? 'Fácil' : 
                       dificultad === 'media' ? 'Media' : 'Alta Dificultad';
            }

            // Cerrar modal con Escape key
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    closeModal();
                }
            });
        </script>
    </th:block>
</body>
</html>
