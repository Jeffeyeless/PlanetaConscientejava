# ========================
# = Base de datos MySQL en Railway=
# ========================

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ========================
# = JPA/HIBERNATE CONFIG =
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ========================
# = THYMELEAF CONFIG =
# ========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.enabled=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.template-resolver-order=1

# ========================
# = EMAIL CONFIGURATION (NUEVO) =
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.username=planetaconsciente.app@gmail.com
spring.mail.password=oylg orgf xlrd cysm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
# Aumenta timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ========================
# = FILE & RESOURCE CONFIG =
# ========================
file.upload-dir=./src/main/resources/static/uploads
spring.mvc.view.prefix=classpath:/templates/
spring.mvc.view.suffix=.html

# ========================
# = SECURITY CONFIG =
# ========================
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN
spring.security.csrf.enabled=true

# ========================
# = SERVER CONFIGURATION =
# ========================
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.whitelabel.enabled=false
server.error.path=/error

# ========================
# = MULTIPART CONFIG =
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB
spring.mvc.hiddenmethod.filter.enabled=true

# ========================
# = CACHE CONFIG =
# ========================
spring.cache.type=simple

# ========================
# = DEVTOOLS CONFIG =
# ========================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,templates/**

# ========================
# = ERROR HANDLING =
# ========================
spring.mvc.throw-exception-if-no-handler-found=true

# ========================
# = ENCODING CONFIG =
# ========================
file.encoding=UTF-8
sun.jnu.encoding=UTF-8

spring.jmx.enabled=true

spring.web.resources.static-locations=classpath:/static/,file:./src/main/resources/static/